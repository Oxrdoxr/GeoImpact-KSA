<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoImpact KSA · لوحة توازن القطاع الثالث</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=17">
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">
      <strong>GeoImpact KSA</strong>
      <span>توازن القطاع الثالث · منصة نوى</span>
    </div>
    <div class="topbar__filters" id="filters"></div>
    <div class="topbar__actions">
      <button type="button" class="btn" id="method-button">كيف نحسب؟</button>
      <button type="button" class="btn" id="print-button">طباعة</button>
    </div>
  </header>

  <main class="board">
    <section class="headline" id="headline" aria-live="polite"></section>
    <section class="kpis" id="kpis"></section>

    <section class="panel panel--leaderboard">
      <h2 class="panel__title">الأكثر حرجًا أولًا <small>اضغط منطقة لعرض تفاصيلها</small></h2>
      <ol class="leaderboard" id="leaderboard"></ol>
    </section>

    <section class="panel panel--detail">
      <h2 class="panel__title" id="detail-title"></h2>
      <div class="legend legend--detail" aria-label="مفتاح الرسم">
        <span><i class="legend-mark legend-mark--actual"></i>المسجل فعليًا</span>
        <span><i class="legend-mark legend-mark--expected"></i>الحصة العادلة المتوقعة</span>
      </div>
      <div id="detail"></div>
    </section>

    <section class="panel panel--shares">
      <h2 class="panel__title">حصة الجهات مقابل حصة السكان</h2>
      <div class="legend">
        <span><i class="swatch swatch--registered"></i>من الجهات</span>
        <span><i class="swatch swatch--population"></i>من السكان</span>
      </div>
      <div id="shares"></div>
    </section>

    <section class="panel panel--matrix">
      <h2 class="panel__title">خريطة العجز <small>الرقم = جهات مطلوبة · اضغط خلية أو عنوان مجال</small></h2>
      <div class="matrix-scroll"><table class="matrix" id="matrix"></table></div>
    </section>

    <section class="panel panel--entities">
      <h2 class="panel__title" id="entities-title"></h2>
      <input id="entity-search" class="search" type="search" placeholder="ابحث بالاسم أو الرقم الموحد" autocomplete="off">
      <ul class="results" id="entities"></ul>
    </section>
  </main>

  <dialog id="method-dialog" class="dialog">
    <div id="method-body"></div>
    <button type="button" class="btn btn--primary" id="method-close">فهمت</button>
  </dialog>

  <footer class="footer" id="footer"></footer>
  <script type="module" src="js/app.js?v=15"></script>
</body>
</html>
